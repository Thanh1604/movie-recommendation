
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: Arial, sans-serif;
  }

  .carousel-container {
    position: relative;
    width: 960px;
    max-width: 100%;
    margin: 0 auto;
    padding: 0 42px;
    box-sizing: border-box;
  }

  .carousel {
    width: 100%;
    overflow: hidden;
  }

  .track {
    display: flex;
    gap: 15px;
    width: max-content;
    transform: translateX(0);
  }

  .movie-card {
    position: relative;
    width: 180px;
    height: 250px;
    flex: 0 0 180px;
    border-radius: 10px;
    overflow: hidden;
    background: #eeeeee;
    border: 1px solid #cccccc;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6px;
    box-sizing: border-box;
    font-size: 16px;
    font-weight: bold;
    color: #777777;
    cursor: pointer;
  }

  .movie-card:hover {
    border: 2px solid #ff4b4b;
  }

  .movie-card img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .badge {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.65);
    color: white;
    font-size: 14px;
    padding: 4px 0;
    text-align: center;
  }

  .movie-number {
    position: absolute;
    top: 8px;
    left: 8px;
    z-index: 2;
    background: #ff4b4b;
    color: white;
    font-size: 16px;
    font-weight: bold;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 36px;
    height: 48px;
    border: none;
    border-radius: 8px;
    background: rgba(0,0,0,0.7);
    color: white;
    font-size: 25px;
    cursor: pointer;
    z-index: 10;
  }

  .nav-btn:hover {
    background: #ff4b4b;
  }

  .prev-btn { left: 0; }
  .next-btn { right: 0; }
</style>
</head>

<body>
<div class="carousel-container">
  <button class="nav-btn prev-btn" id="prevBtn">&#10094;</button>

  <div class="carousel">
    <div class="track" id="movieTrack"></div>
  </div>

  <button class="nav-btn next-btn" id="nextBtn">&#10095;</button>
</div>

<script>
const track = document.getElementById("movieTrack");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

let movies = [];
let position = 0;
let autoTimer = null;
let clickCounter = 0;
let rendered = false;

function sendToStreamlit(value) {
  window.parent.postMessage({
    isStreamlitMessage: true,
    type: "streamlit:setComponentValue",
    value: value,
    dataType: "json"
  }, "*");
}

function createCard(item, index) {
  const card = document.createElement("div");
  card.className = "movie-card";
  card.title = item.title || "";
  card.dataset.title = item.title || "";
  card.dataset.year = item.year == null ? "" : String(item.year);

  if (item.poster_url) {
    const img = document.createElement("img");
    img.src = item.poster_url;
    img.alt = item.title || "";
    card.appendChild(img);
  } else {
    card.textContent = item.title || "Không có tên phim";
  }

  const number = document.createElement("div");
  number.className = "movie-number";
  number.textContent = String(index + 1);
  card.appendChild(number);

  if (item.poster_url && item.avg_rating != null) {
    const badge = document.createElement("div");
    badge.className = "badge";
    badge.textContent = "⭐ " + item.avg_rating;
    card.appendChild(badge);
  }

  card.addEventListener("click", function() {
    clickCounter++;

    sendToStreamlit({
      title: card.dataset.title,
      year: card.dataset.year,
      event_id: Date.now() + "-" + clickCounter
    });
  });

  return card;
}

function renderCarousel(items) {
  movies = Array.isArray(items) ? items : [];
  track.replaceChildren();
  position = 0;

  movies.forEach((item, index) => {
    track.appendChild(createCard(item, index));
  });

  // Sao chép 5 phim đầu để tạo vòng lặp liên tục.
  movies.slice(0, 5).forEach((item, index) => {
    track.appendChild(createCard(item, index));
  });

  rendered = true;
  moveTo(0, false);
  startAutoPlay();
}

function moveTo(newPosition, smooth = true) {
  const step = 195;
  position = newPosition;
  track.style.transition = smooth ? "transform 0.5s ease" : "none";
  track.style.transform =
    "translateX(-" + (position * step) + "px)";
}

function moveCarousel() {
  if (movies.length <= 1) return;

  position++;
  moveTo(position);

  if (position >= movies.length) {
    setTimeout(function() {
      if (position >= movies.length) {
        moveTo(0, false);
      }
    }, 500);
  }
}

function startAutoPlay() {
  clearInterval(autoTimer);
  autoTimer = setInterval(function() {
    if (position >= movies.length) {
      moveTo(0, false);
    }
    moveCarousel();
  }, 3000);
}

prevBtn.addEventListener("click", function() {
  if (!movies.length) return;

  if (position <= 0) {
    moveTo(Math.max(0, movies.length - 1), false);
  } else {
    moveTo(position - 1);
  }
  startAutoPlay();
});

nextBtn.addEventListener("click", function() {
  if (!movies.length) return;
  moveCarousel();
  startAutoPlay();
});

// Giao thức nhận dữ liệu và gửi sự kiện của Streamlit component.
window.addEventListener("message", function(event) {
  const message = event.data;

  if (!message || message.type !== "streamlit:render") return;

  const args = message.args || {};
  renderCarousel(args.items || []);
});

window.parent.postMessage({
  isStreamlitMessage: true,
  type: "streamlit:componentReady",
  apiVersion: 1
}, "*");

window.parent.postMessage({
  isStreamlitMessage: true,
  type: "streamlit:setFrameHeight",
  height: 280
}, "*");
</script>
</body>
</html>
